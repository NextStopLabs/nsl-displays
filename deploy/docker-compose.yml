version: "3.8"
services:
  portal:
    build: ../portal
    environment:
      DATABASE_URL: postgres://nsl:nsl@db:5432/nsl
      STORAGE_DIR: /data
      PORTAL_SECRET: ${PORTAL_SECRET:-change-me}
    volumes:
      - nsl-data:/data
    depends_on: [db]
    ports: ["8080:8000"]
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --root-path /portal
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nsl
      POSTGRES_PASSWORD: nsl
      POSTGRES_DB: nsl
    volumes: [pg-data:/var/lib/postgresql/data]
  storage:
    image: minio/minio
    command: server /data
    volumes: [nsl-data:/data]
  tts:
    build: ../portal
    command: python -m backend.tts_worker
    volumes: [nsl-data:/data]
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./config/Caddyfile:/etc/caddy/Caddyfile", nsl-data:/data]
volumes:
  nsl-data: {}
  pg-data: {}
