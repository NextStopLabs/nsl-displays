<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Destination Controller</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* stage: the faceplate is drawn in a fixed 677x214 design space and
     scaled to fit whatever space is available */
    .stage {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
    }

    .hint {
      flex: 0 0 auto;
      text-align: center;
      color: #777;
      font-size: 11px;
      padding: 6px 8px 10px;
    }

    .unit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 600px;
      height: 214px;
      transform-origin: 50% 50%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
      background: radial-gradient(120% 140% at 30% 0%, #5c6168 0%, #4b4f55 45%, #3d4147 100%);
    }

    .unit::after {
      /* inner edge shading */
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 6px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, .55), inset 0 -2px 4px rgba(0, 0, 0, .35);
    }

    /* everything inside is positioned in the original 768x262 coordinates,
     shifted so only the grey faceplate shows */
    .inner {
      position: absolute;
      left: -31px;
      top: -24px;
      width: 768px;
      height: 262px;
    }

    /* logo */
    .hv-logo {
      position: absolute;
      left: 47px;
      top: 34px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hv-logo img {
      height: 32px;
      width: auto;
      display: block;
    }

    .hv-model {
      font-size: 15px;
      font-weight: 600;
      color: #16181b;
      letter-spacing: .3px;
    }

    .hv-led {
      position: absolute;
      left: 75px;
      top: 70px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5a1a14, #1d0806 70%);
      box-shadow: 0 0 0 1.5px #25272b;
    }

    /* card slot */
    .hv-slot {
      position: absolute;
      left: 53px;
      top: 88px;
      width: 72px;
      height: 72px;
      background: #0a0a0b;
      box-shadow: 0 0 0 1px #2a2c30, inset 0 0 0 1px #1a1a1c;
    }

    .hv-slot::after {
      content: "";
      position: absolute;
      left: 34px;
      top: 0;
      width: 3px;
      height: 72px;
      background: #1c1c1e;
    }

    .hv-slot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .07), transparent 40%);
    }

    /* display */
    .display {
      position: absolute;
      left: 50px;
      top: 73px;
      width: 313px;
      height: 110px;
      background: #060505;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 0 0 3px #17181b, 0 0 0 4px #53575d, inset 0 0 14px rgba(0, 0, 0, .9);
      color: #ffb21c;
      font-family: "DejaVu Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      text-shadow: 0 0 5px rgba(255, 170, 0, .55);
    }

    .display::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .hv-route {
      position: absolute;
      left: 17px;
      top: 5px;
      font-size: 45px;
      font-weight: 700;
      line-height: 50px;
      letter-spacing: -.5px;
      white-space: nowrap;
    }

    .hv-dest {
      position: absolute;
      left: 92px;
      top: 6px;
      width: 208px;
      height: 50px;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 16.5px;
      font-weight: 700;
      line-height: 22px;
    }

    .hv-dest div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .hv-left {
      position: absolute;
      left: 14px;
      top: 62px;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .5px;
      white-space: pre;
    }

    .hv-right {
      position: absolute;
      right: 15px;
      top: 62px;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .5px;
      white-space: pre;
      text-align: right;
    }

    .dim {
      color: #b87d00;
      text-shadow: none;
    }

    .hv-left.dim {
      font-size: 15px;
      top: 65px;
    }

    /* board replica (main screen): drawn in the layout's own pixel space
       and scaled up to fill the display */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      overflow: hidden;
      text-shadow: 0 0 3px rgba(255, 170, 0, .5);
      font-family: "DejaVu Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
    }

    .board .el {
      position: absolute;
      display: flex;
      overflow: hidden;
      line-height: 1;
    }

    .board .el .t {
      flex: 0 0 auto;
      white-space: pre;
    }

    .board .el .logo {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid currentColor;
      border-radius: 20%;
      text-shadow: none;
    }

    @keyframes mq {

      0%,
      15% {
        transform: translateX(0)
      }

      85%,
      100% {
        transform: translateX(var(--d))
      }
    }

    /* dest code + insert code readout pinned to the bottom of the display,
       below the scaled board replica */
    .codebar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      padding-right: 10px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #ffb21c;
    }

    /* non-default screens (code entry, service / destination lists) */
    .hv-flex {
      position: absolute;
      inset: 0;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .big {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .small {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .5px;
    }

    .entry {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    .err {
      color: #ff5a4a;
      text-shadow: none;
    }

    .list {
      font-size: 14px;
      line-height: 19px;
      margin-top: 4px;
    }

    .list .item {
      display: flex;
      gap: 8px;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .list .item span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list .item > span:first-child {
      flex: 0 0 auto;
    }

    /* rail picker: long station names must ellipsize, never push the
       cursor/selection highlight off the right edge of the screen */
    .rail .line > span {
      min-width: 0;
    }

    .rail .line > span:last-child {
      flex: 0 0 auto;
    }

    .rail-head {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list .item.sel {
      background: rgba(255, 178, 28, .25);
      color: #ffd36b;
    }

    /* key legends */
    .hv-abc {
      position: absolute;
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: .5px;
      color: #e9edf2;
      transform: translate(-50%, -50%);
    }

    /* keys */
    .key {
      position: absolute;
      width: 35px;
      height: 35px;
      margin: -17.5px 0 0 -17.5px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      cursor: pointer;
      outline: none;
      font: 700 16px/35px "Helvetica Neue", Arial, sans-serif;
      color: #2a2f36;
      background: radial-gradient(circle at 50% 30%, #f4f7fb 0%, #d4dbe4 45%, #a3afbd 100%);
      box-shadow: 0 2px 3px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -2px 3px rgba(60, 75, 95, .35);
      transition: transform .04s, box-shadow .04s;
    }

    .key:active,
    .key.pressed {
      transform: translateY(1px) scale(.97);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, inset 0 2px 4px rgba(60, 75, 95, .5);
    }

    .key:focus-visible {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4d9bff;
    }

    .key.red {
      color: #d42a1e;
    }

    .key.amber {
      color: #e8730a;
      font-size: 15px;
      background: radial-gradient(circle at 50% 30%, #fff3c6 0%, #ffd470 40%, #f4a323 100%);
      box-shadow: 0 2px 3px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, 0 0 9px rgba(255, 185, 60, .55),
        inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -2px 3px rgba(190, 110, 10, .35);
    }

    .key.amber:active,
    .key.amber.pressed {
      box-shadow: 0 1px 1px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, 0 0 6px rgba(255, 185, 60, .4), inset 0 2px 4px rgba(190, 110, 10, .5);
    }

    .key.arrow svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 35px;
      height: 35px;
    }

    .key.arrow svg path {
      fill: #2a2f36;
      stroke: #2a2f36;
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .key.ent {
      font-size: 12px;
      letter-spacing: -.2px;
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="unit" id="unit" style="transform: translate(-50%, -50%) scale(1.39291);">
      <div class="inner">

        <div class="hv-logo">
          <img src="NSL-Displays-1.png" alt="NSL Displays">
          <span class="hv-model">NC1</span>
        </div>

        <div class="display" id="screen">
          <div class="hv-route" style="font-size:45px">--</div>
          <div class="hv-dest">
            <div>No destination</div>
          </div>
          <div class="hv-right">----</div>
        </div>

        <!-- key legends -->
        <span class="hv-abc" style="left:435px;top:75px;">ABC</span>
        <span class="hv-abc" style="left:500px;top:75px;">DEF</span>
        <span class="hv-abc" style="left:565px;top:75px;">GHI</span>
        <span class="hv-abc" style="left:435px;top:120px;">JKL</span>
        <span class="hv-abc" style="left:500px;top:120px;">MNO</span>
        <span class="hv-abc" style="left:565px;top:120px;">PQR</span>
        <span class="hv-abc" style="left:435px;top:165px;">STU</span>
        <span class="hv-abc" style="left:500px;top:165px;">VWX</span>
        <span class="hv-abc" style="left:565px;top:165px;">YZ</span>

        <!-- keypad -->
        <button class="key red" data-btn="x" style="left:400px;top:75px">X</button>

        <button class="key red" data-btn="y" style="left:400px;top:119px">Y</button>

        <button class="key amber" data-btn="i" style="left:400px;top:162px">I</button>
        <button class="key" data-num="7" style="left:465px;top:162px">7</button>

        <button class="key amber" data-btn="r" style="left:400px;top:207px">R</button>

        <button class="key" data-num="0" style="left:530px;top:207px">0</button>
        <button class="key amber ent" data-btn="ent" style="left:595px;top:207px">ENT</button>

        <!-- arrows + F -->
        <button class="key arrow" data-btn="left" style="left:65px;top:207px" title="Back" aria-label="Left"><svg
            viewBox="0 0 35 35">
            <path d="M22 9 L11 17.5 L22 26 Z"></path>
          </svg></button>
        <button class="key arrow" data-btn="right" style="left:115px;top:207px" title="Enter destinations"
          aria-label="Right"><svg viewBox="0 0 35 35">
            <path d="M13 9 L24 17.5 L13 26 Z"></path>
          </svg></button>
        <button class="key arrow" data-btn="up" style="left:165px;top:207px" title="Up" aria-label="Up"><svg
            viewBox="0 0 35 35">
            <path d="M17.5 10 L27 23 L8 23 Z"></path>
          </svg></button>
        <button class="key arrow" data-btn="down" style="left:215px;top:207px" title="Down" aria-label="Down"><svg
            viewBox="0 0 35 35">
            <path d="M17.5 25 L27 12 L8 12 Z"></path>
          </svg></button>
        <button class="key amber" data-btn="f" style="left:345px;top:207px">F</button>

      </div>
    </div>
  </div>
  <div class="hint" id="hint">D = type code · ▲▼ = services · ENT = select</div>

<script>
const state = { services: [], current: {}, mode: "view", selSvc: 0, selDest: 0, code: [], codeError: "", listError: "", selAdmin: 0, adminMsg: "", programs: [], selProg: 0, seq: [], railFrom: null, railTo: null, railBuf: "", railMatches: [], railSel: 0, railTap: null };
const MAX_CODE = 4;
const LIST_ROWS = 4;
const screen = document.getElementById("screen");
const hint = document.getElementById("hint");

/* ---------- scale the faceplate to fit ---------- */
const stage = document.getElementById("stage");
const unit = document.getElementById("unit");
function fit() {
  const s = Math.min(stage.clientWidth / 677, stage.clientHeight / 214);
  unit.style.transform = `translate(-50%,-50%) scale(${s})`;
}
new ResizeObserver(fit).observe(stage);
fit();

/* ---------- API ---------- */
async function api(path, body) {
  const opts = body ? { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>null))?.detail || ("HTTP "+r.status));
  return r.json().catch(()=>null);
}
async function refresh() {
  try { state.current = await api("/api/state") || {}; } catch(e){}
  if (!state.services.length) {
    try { const b = await api("/api/browse"); state.services = b.services || []; sortLists(); } catch(e){}
  }
  if (state.mode === "view") render();
}

/* ---------- helpers ---------- */
function sortLists() {
  const svcs = state.services || [];
  svcs.sort((a, b) =>
    String(a.number || "").localeCompare(String(b.number || ""), undefined, {numeric: true}));
  for (const s of svcs) {
    (s.destinations || []).sort((a, b) =>
      String(a.code || "").localeCompare(String(b.code || ""), undefined, {numeric: true}));
  }
}
function fmtCode(c) {
  if (!c && c !== "0") return "----";
  return String(c).padStart(4, "0");
}
function fmtDepEntry(digits) {
  const d = (digits || []).join("");
  if (!d) return "--:--";
  if (d.length <= 2) return d;
  return d.slice(0, -2) + ":" + d.slice(-2);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function splitDest(s) {
  s = String(s || "");
  const words = s.split(" ");
  if (s.length <= 16 || words.length < 2) return [s];
  let best = 1, bd = 1e9;
  for (let i = 1; i < words.length; i++) {
    const d = Math.abs(words.slice(0,i).join(" ").length - words.slice(i).join(" ").length);
    if (d < bd) { bd = d; best = i; }
  }
  return [words.slice(0,best).join(" "), words.slice(best).join(" ")];
}
function windowRange(n, sel, size) {
  const start = Math.max(0, Math.min(sel - Math.floor(size / 2), n - size));
  return [start, Math.min(n, start + size)];
}
function listHtml(items, sel, label) {
  if (!items.length) return `<div class="list"><div class="item"><span>&nbsp;</span><span>NONE</span></div></div>`;
  const [a, b] = windowRange(items.length, sel, LIST_ROWS);
  let h = "";
  for (let i = a; i < b; i++) {
    h += `<div class="item ${i===sel?"sel":""}"><span>${i===sel?">":" "}</span><span>${esc(label(items[i]))}</span></div>`;
  }
  return `<div class="list">${h}</div>`;
}

/* ---------- board replica ---------- */
const DISPLAY_W = 313;            // on-screen width of the display area
const DISPLAY_CY = 128;           // vertical centre of the display area
let boardTimer = null, boardKey = null;

function stopBoard() {
  clearTimeout(boardTimer); boardTimer = null; boardKey = null;
  screen.style.height = ""; screen.style.top = "";
}
// "han-2423B3E1" -> 24px tall, bold ; "han-1610N2E1" -> 16px tall, normal ; "han-LOGO17" -> logo glyph 17px
function parseFont(f) {
  f = String(f || "");
  if (/LOGO/i.test(f)) return { h: parseInt((f.match(/(\d+)\s*$/) || [0, 17])[1], 10) || 17, bold: true, logo: true };
  const m = /(\d{2})\d{2}([A-Z])/.exec(f);
  return { h: m ? parseInt(m[1], 10) : 16, bold: m ? m[2] === "B" : true, logo: false };
}
function boardElHtml(e, vals, hide) {
  let txt;
  if (e.type === "field") {
    if (hide.includes(e.field)) return "";
    txt = vals[e.field] || "";
  } else txt = e.text || "";
  if (e.show_if === "has_text" && !String(txt).trim()) return "";
  const f = parseFont(e.font), sc = e.scale || 1;
  const jc = { left: "flex-start", centre: "center", center: "center", right: "flex-end" }[e.align] || "center";
  const ai = { top: "flex-start", middle: "center", bottom: "flex-end" }[e.valign] || "center";
  const fg = e.colour || "#FFB000";
  const st = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;justify-content:${jc};align-items:${ai};` +
    (e.invert ? `background:${fg};color:#000;text-shadow:none;` : `color:${fg};`);
  const ls = ((e.spacing || 1) - 1);
  let inner;
  if (f.logo) {
    const sz = Math.round(f.h * sc);
    inner = `<span class="t logo" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz * .6)}px">${esc(txt)}</span>`;
  } else {
    inner = `<span class="t" style="font-size:${Math.round(f.h * sc * .85)}px;font-weight:${f.bold ? 700 : 400};letter-spacing:${ls}px">${esc(txt)}</span>`;
  }
  return `<div class="el" data-scroll="${esc(e.scroll || "none")}" style="${st}">${inner}</div>`;
}
function renderBoard(cur) {
  let layout;
  try { layout = JSON.parse(cur.layouts.front); } catch (e) { return false; }
  if (!layout || !layout.width) return false;

  const st = cur.state || {};
  const fields = cur.fields || {};
  const ovo = cur.override;
  const ovText = (ovo && (ovo.text || ovo.override_text)) || st.override_text || "";
  const ovCfg = layout.override || {};
  const ins = cur.insert && cur.insert.destination;
  const dep = cur.departure || {};
  const depText = dep.text || (dep.time ? `Departing ${dep.time}` : "");
  const depActive = dep.active && depText;

  let pages;
  if (ovText) {
    pages = [Object.assign({}, fields, { [ovCfg.replaces || "dest"]: ovText })];
  } else if (depActive) {
    // F-key departure time: frozen on P1, front via shows the countdown.
    const p1 = (cur.pages && cur.pages.length ? cur.pages[0] : fields);
    pages = [Object.assign({}, fields, p1, { via: depText })];
  } else {
    pages = (cur.pages && cur.pages.length ? cur.pages : [fields]).map(p => Object.assign({}, fields, p));
    if (ins) pages.push({ num: ins.num || fields.num, via: ins.via || "", dest: ins.dest || ins.name || "" });
  }
  const hide = ovText ? (ovCfg.hide || []) : [];

  const dest0 = cur.destination || {};
  const svc0 = cur.service || {};
  const code0 = fmtCode(dest0.code || svc0.number || "");
  const insTag0 = ins ? ` +${ins.code || "INS"}` : "";
  const depTag0 = depActive ? ` · ${depText}` : "";

  const key = JSON.stringify([cur.layouts.front, pages, hide, code0, insTag0, depTag0]);
  if (key === boardKey && screen.querySelector(".board")) return true;
  clearTimeout(boardTimer);
  boardKey = key;

  const scale = DISPLAY_W / layout.width;
  const dispH = Math.round(layout.height * scale);
  screen.innerHTML = `<div class="board" style="width:${layout.width}px;height:${layout.height}px;background:${esc(layout.background || "#000")};transform:scale(${scale})"></div><div class="codebar">${esc(code0)}${esc(insTag0)}</div>`;
  const board = screen.firstChild;

  let idx = 0;
  const secs = Math.max(1, layout.page_seconds || 3);
  function show() {
    const pe = layout.page_elements && layout.page_elements[String(idx + 1)];
    const els = (pe && pe.length ? pe : layout.elements) || [];
    board.innerHTML = els.map(e => boardElHtml(e, pages[idx], hide)).join("");
    board.querySelectorAll('.el[data-scroll="if_too_long"]').forEach(el => {
      const t = el.firstChild, over = t.offsetWidth - el.clientWidth;
      if (over > 1) {
        el.style.justifyContent = "flex-start";
        t.style.setProperty("--d", -over + "px");
        t.style.animation = `mq ${Math.max(3, over / 18 + 2)}s linear infinite alternate`;
      }
    });
    if (pages.length > 1) {
      idx = (idx + 1) % pages.length;
      boardTimer = setTimeout(show, secs * 1000);
    }
  }
  show();
  return true;
}

/* ---------- render ---------- */
function render() {
  renderScreen();
  paintKeys();
}

/* keys that do something on the current screen stay bright, the rest dim.
   Digits are tagged n0..n9, the rest by their data-btn name. */
function activeKeys() {
  const nums = ["n0","n1","n2","n3","n4","n5","n6","n7","n8","n9"];
  switch (state.mode) {
    case "code":
    case "insert":
    case "rail_from":
    case "rail_to":
    case "depart": return new Set([...nums, "x", "ent"]);
    case "services": return new Set(["up", "down", "right", "ent", "x"]);
    case "destinations": return new Set(["up", "down", "left", "ent", "x"]);
    case "admin": return new Set(["up", "down", "left", "right", "ent", "x"]);
    case "programs": return new Set(["up", "down", "left", "ent", "x"]);
    default: {
      // cloud bus-picker (no bus chosen yet): only list navigation works
      if (state.cid === null) return new Set(["up", "down", "ent"]);
      const s = new Set(["d", "i", "f", "r", "up", "down"]);
      if (state.seq.length === 1 && state.seq[0] === "r") s.add("x");
      if (state.seq.length === 2 && state.seq[0] === "r" && state.seq[1] === "x") s.add("ent");
      return s;
    }
  }
}
/* usable keys get the yellow cap, the rest stay white.
   Digits are tagged n0..n9, the rest by their data-btn name. Amber is
   defined after red in the CSS so it wins while a key is usable. */
function paintKeys() {
  let active;
  try { active = activeKeys(); } catch(e) { return; }
  document.querySelectorAll("button.key").forEach(b => {
    const k = b.dataset.num !== undefined ? "n" + b.dataset.num : b.dataset.btn;
    b.classList.toggle("amber", active.has(k));
  });
}
function renderScreen() {

  const ins = state.current.insert;

  const railTag = rail ? `RAIL ${(rail.from_name||"")}→${(rail.to_name||"")}` : "F+R = rail";

    ? (dep.text || `Departing ${dep.time}`)

  const baseHint = (ins && ins.destination)

  hint.textContent = depHint ? `${depHint} · F = change · ${baseHint}` : `${baseHint} · F = depart time`;

  // main screen: replicate what the board is actually showing

  // fallback if the state has no usable front layout
  stopBoard();
  const num = String(svc.number || "--");
  const fs = num.length <= 2 ? 45 : num.length === 3 ? 34 : 26;
  const insTag = ins && ins.destination ? ` +${esc(ins.destination.code || "INS")}` : "";
  screen.innerHTML = `

    <div class="hv-right">${esc(code)}${insTag}</div>`;

/* ---------- actions (logic unchanged) ---------- */
function enterCode() {
  state.mode = "code"; state.code = []; state.codeError = ""; render();
}
function enterInsert() {
  state.mode = "insert"; state.code = []; state.codeError = ""; render();
}
function enterDepart() {
  state.mode = "depart"; state.code = []; state.codeError = ""; render();
}
/* rail replacement window (F then R): pick start stop X, then end stop Y
   from the current destination's portal-defined stops. Digits multi-tap
   through the faceplate T9 legends (1=ABC … 9=YZ, 0=space); a full keyboard
   types letters directly. */
const T9 = { "1":"ABC", "2":"DEF", "3":"GHI", "4":"JKL", "5":"MNO", "6":"PQR", "7":"STU", "8":"VWX", "9":"YZ", "0":" " };
function railStops() {
  const destId = (state.current.state || {}).destination_id;
  for (const s of state.services || [])
    for (const d of s.destinations || [])
      if (d.id === destId) return d.stops || [];
  return [];
}
function railFilter() {
  const q = state.railBuf.trim().toUpperCase();
  const stops = railStops();
  if (!q) { state.railMatches = stops.slice(); }
  else {
    // CRS codes match first (typing SOT jumps straight to Stoke), then names
    const crsHit = stops.filter(s => String(s.crs || "").toUpperCase().startsWith(q));
    const nameHit = stops.filter(s => !String(s.crs || "").toUpperCase().startsWith(q)
      && String(s.board_text || s.name || "").toUpperCase().includes(q));
    state.railMatches = crsHit.concat(nameHit);
  }
  state.railSel = 0;
}
function railStopLabel(s) {
  return `${s.position} ${s.crs ? s.crs + " " : ""}${(s.board_text || s.name)}`;
}
function enterRailFrom() {
  if (!((state.current.state || {}).destination_id)) { state.codeError = ""; return; }
  state.mode = "rail_from"; state.railFrom = null; state.railTo = null;
  state.railBuf = ""; state.railTap = null; state.codeError = "";
  railFilter(); render();
}
function enterRailTo() {
  state.mode = "rail_to"; state.railBuf = ""; state.railTap = null; state.codeError = "";
  railFilter(); render();
}
function railCommitTap() {
  // multi-tap keeps the letter pending; committing just clears the tap state
  state.railTap = null;
}
function appendRailDigit(n) {
  const g = T9[n];
  if (!g) return;
  const now = Date.now();
  const t = state.railTap;
  const cyc = g + n;  // S,T,U,7… classic multi-tap ends on the digit
  if (t && t.digit === n && now - t.at < 1000) {
    t.idx = (t.idx + 1) % cyc.length;
    state.railBuf = state.railBuf.slice(0, -1) + cyc[t.idx];
    t.at = now;
  } else {
    state.railBuf += g[0];
    state.railTap = { digit: n, idx: 0, at: now };
  }
  state.codeError = ""; railFilter(); render();
}
function appendRailLetter(ch) {
  railCommitTap();
  state.railBuf += String(ch || "").toUpperCase();
  state.codeError = ""; railFilter(); render();
}
function railBackspace() {
  if (state.railTap) { state.railBuf = state.railBuf.slice(0, -1); state.railTap = null; }
  else state.railBuf = state.railBuf.slice(0, -1);
  state.codeError = ""; railFilter(); render();
}
/* hidden admin menu: press R, X, ENT in sequence from the main screen */
function adminSeq(btn) {
  if (state.mode !== "view") { state.seq = []; return false; }
  if (btn !== "r" && btn !== "x" && btn !== "ent") { state.seq = []; return false; }
  state.seq.push(btn);
  if (state.seq.length > 3) state.seq.shift();
  if (state.seq.length === 3 && state.seq[0] === "r" && state.seq[1] === "x" && state.seq[2] === "ent") {
    state.seq = [];
    openAdmin();
    return true;
  }
  return false;
}
async function openAdmin() {
  state.mode = "admin"; state.selAdmin = 0; state.adminMsg = "";
  try {
    const p = await api("/api/programs");
    state.programs = collapsePrograms(p.installed || [], (state.current.state || {}).program_id);
  } catch(e) { state.programs = []; }
  render();
}
function collapsePrograms(rows, activePid) {
  const m = {};
  for (const r of rows || []) {
    const pid = r.program_id;
    if (!m[pid] || (r.version || 0) > (m[pid].version || 0)) {
      m[pid] = { id: pid, name: r.program_name || String(pid || "").slice(0, 8),
                 version: r.version, active: pid === activePid };
    }
  }
  return Object.values(m);
}
function appendDigit(n) {
  if (state.mode === "rail_from" || state.mode === "rail_to") { appendRailDigit(n); return; }
  if (state.mode === "depart") {
    if (state.code.length >= 4) state.code.shift();
    state.code.push(n); state.codeError = ""; render();
    return;
  }
  if (state.mode !== "code" && state.mode !== "insert") return;
  if (state.code.length >= MAX_CODE) state.code.shift();
  state.code.push(n); state.codeError = ""; render();
}
function backspace() {
  if (state.mode === "rail_from" || state.mode === "rail_to") { railBackspace(); return; }
  if (state.mode !== "code" && state.mode !== "insert" && state.mode !== "depart") return;
  state.code.pop(); state.codeError = ""; render();
}
async function cancelCode() {
  if (state.mode === "rail_from" && state.current.rail) {
    // X with a window active clears it
    try {
      await api("/api/command", {command:"rail_clear"});
      state.mode = "view"; state.codeError = "";
      await refresh();
    } catch(e) { state.codeError = "ERROR"; render(); }
    return;
  }
  if (state.mode === "rail_from" || state.mode === "rail_to") { state.mode = "view"; state.codeError = ""; render(); return; }
  if (state.mode === "code" || state.mode === "insert" || state.mode === "depart") { state.mode = "view"; state.codeError = ""; render(); return; }
  if (state.mode === "admin") { state.mode = "view"; state.adminMsg = ""; render(); return; }
  if (state.mode === "programs") { state.mode = "admin"; state.adminMsg = ""; render(); return; }
  if (state.mode === "destinations") { state.mode = "services"; state.listError = ""; render(); return; }
  if (state.mode === "services") { state.mode = "view"; render(); }
}
async function confirm() {
  if (state.mode === "admin") {
    if (state.selAdmin === 0) {  // reload the running program from disk
      const pid = (state.current.state || {}).program_id;
      if (!pid) { state.adminMsg = "NO PROGRAM LOADED"; render(); return; }
      try {
        await api("/api/command", {command: "select_program", program_id: pid});
        state.mode = "view"; state.services = []; state.adminMsg = "";
        await refresh();
      } catch(e) { state.adminMsg = "FAILED"; buzz([35, 40, 35]); render(); }
      return;
    }
    if (state.selAdmin === 1) {
      state.mode = "programs";
      state.selProg = Math.max(0, (state.programs || []).findIndex(p => p.active));
      state.adminMsg = "";
      render();
      return;
    }
    if (state.selAdmin === 2) {  // join hotspot + sync programs/software
      state.adminMsg = "SYNCING…"; render();
      try {
        const r = await api("/api/update", {});
        state.adminMsg = (r && r.ok) ? ("STAGED " + (r.version || "")) : "NO UPDATE";
      } catch(e) { state.adminMsg = (e.message || "FAILED").slice(0, 28); buzz([35, 40, 35]); }
      render();
      return;
    }
  }
  if (state.mode === "programs") {
    const p = (state.programs || [])[state.selProg];
    if (!p) return;
    try {
      await api("/api/command", {command: "select_program", program_id: p.id});
      state.mode = "view"; state.services = []; state.adminMsg = "";
      await refresh();
    } catch(e) { state.adminMsg = "FAILED"; buzz([35, 40, 35]); render(); }
    return;
  }
  if (state.mode === "insert") {
    const c = state.code.join("");
    if (c.length === 0) {
      // ENT with no digits clears an active insert
      try {
        await api("/api/command", {command:"insert_clear"});
        state.mode = "view"; state.code = []; state.codeError = "";
        await refresh();
      } catch(e) {
        state.codeError = "ERROR"; buzz([35, 40, 35]);
        render();
      }
      return;
    }
    try {
      await api("/api/command", {command:"insert_code", code:c});
      state.mode = "view"; state.code = []; state.codeError = "";
      await refresh();
    } catch(e) {
      state.codeError = "NOT FOUND"; buzz([35, 40, 35]);
      render();
    }
    return;
  }
  if (state.mode === "depart") {
    const c = state.code.join("");
    if (c.length === 0) {
      // ENT with no digits clears an active departure time
      try {
        await api("/api/command", {command:"depart_clear"});
        state.mode = "view"; state.code = []; state.codeError = "";
        await refresh();
      } catch(e) {
        state.codeError = "ERROR"; buzz([35, 40, 35]);
        render();
      }
      return;
    }
    const d = c.replace(/\D/g, "");
    let hhmm = null;
    if (/^\d{3,4}$/.test(d)) {
      const hh = parseInt(d.slice(0, -2), 10), mm = parseInt(d.slice(-2), 10);
      if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59) hhmm = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    }
    if (!hhmm) {
      state.codeError = "BAD TIME"; buzz([35, 40, 35]);
      render();
      return;
    }
    try {
      await api("/api/command", {command:"depart_set", time: hhmm});
      state.mode = "view"; state.code = []; state.codeError = "";
      await refresh();
    } catch(e) {
      state.codeError = "ERROR"; buzz([35, 40, 35]);
      render();
    }
    return;
  }
  if (state.mode === "rail_from") {
    railCommitTap();
    // ENT always confirms the highlighted stop (arrows alone are enough)
    const pick = state.railMatches[state.railSel];
    if (!pick) { state.codeError = "NO MATCH"; buzz([35, 40, 35]); render(); return; }
    state.railFrom = pick;
    enterRailTo();
    return;
  }
  if (state.mode === "rail_to") {
    railCommitTap();
    const pick = state.railMatches[state.railSel];
    if (!pick) { state.codeError = "NO MATCH"; buzz([35, 40, 35]); render(); return; }
    try {
      await api("/api/command", {command:"rail_set", from_stop_id: state.railFrom.id, to_stop_id: pick.id});
      state.mode = "view"; state.railBuf = ""; state.codeError = "";
      await refresh();
    } catch(e) {
      state.codeError = "ERROR"; buzz([35, 40, 35]);
      render();
    }
    return;
  }
  if (state.mode === "code") {
    const c = state.code.join("");
    if (c.length === 0) return;
    try {
      await api("/api/command", {command:"select_code", code:c});
      state.mode = "view"; state.code = []; state.codeError = "";
      await refresh();
    } catch(e) {
      state.codeError = "NOT FOUND"; buzz([35, 40, 35]);
      render();
    }
    return;
  }
  if (state.mode === "destinations") {
    const svc = state.services[state.selSvc];
    const dest = (svc&&svc.destinations||[])[state.selDest];
    if (!dest) return;
    try {
      await api("/api/command", {command:"select_destination", destination_id:dest.id});
      state.mode = "view"; state.listError = "";
      await refresh();
    } catch(e) {
      state.listError = "ERROR"; buzz([35, 40, 35]);
      render();
    }
    return;
  }
  if (state.mode === "services") {
    state.mode = "destinations"; state.selDest = 0; state.listError = ""; render();
  }
}
function move(dir) {
  if (state.mode === "rail_from" || state.mode === "rail_to") {
    railCommitTap();
    if (dir === "left") {
      if (state.railBuf) { railBackspace(); return; }
      if (state.mode === "rail_to") { enterRailFrom(); return; }
      state.mode = "view"; state.codeError = ""; render(); return;
    }
    const n = state.railMatches.length;
    if (dir === "up") state.railSel = Math.max(0, state.railSel - 1);
    if (dir === "down") state.railSel = Math.min(Math.max(0, n - 1), state.railSel + 1);
    render();
    return;
  }
  if (state.mode === "code" || state.mode === "insert" || state.mode === "depart") {
    if (dir === "left") backspace();          // ◄ deletes a digit while typing a code
    return;
  }
  if (state.mode === "admin") {
    if (dir === "up") state.selAdmin = Math.max(0, state.selAdmin - 1);
    if (dir === "down") state.selAdmin = Math.min(2, state.selAdmin + 1);
    if (dir === "right") { confirm(); return; }
    if (dir === "left") { state.mode = "view"; state.adminMsg = ""; }
    render();
  } else if (state.mode === "programs") {
    if (dir === "up") state.selProg = Math.max(0, state.selProg - 1);
    if (dir === "down") state.selProg = Math.min(state.programs.length - 1, state.selProg + 1);
    if (dir === "left") { state.mode = "admin"; state.adminMsg = ""; }
    render();
  } else if (state.mode === "services") {
    if (dir === "up") state.selSvc = Math.max(0, state.selSvc-1);
    if (dir === "down") state.selSvc = Math.min(state.services.length-1, state.selSvc+1);
    if (dir === "right") { confirm(); return; }
    render();
  } else if (state.mode === "destinations") {
    const svc = state.services[state.selSvc] || {};
    const n = (svc.destinations||[]).length;
    if (dir === "up") state.selDest = Math.max(0, state.selDest-1);
    if (dir === "down") state.selDest = Math.min(n-1, state.selDest+1);
    if (dir === "left") { state.mode = "services"; }
    state.listError = "";
    render();
  } else if (state.mode === "view") {
    if (dir === "up" || dir === "down") { state.mode = "services"; state.selSvc = 0; render(); }
  }
}

/* ---------- input ---------- */
document.body.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  e.preventDefault();
  const num = b.dataset.num;
  const btn = b.dataset.btn;
  if (num !== undefined) { state.seq = []; buzz(12); appendDigit(num); return; }
  if (btn === "r" || btn === "x" || btn === "ent") { if (adminSeq(btn)) return; }
  else state.seq = [];
  buzz(12);
  if (btn === "d") enterCode();
  else if (btn === "i") enterInsert();
  else if (btn === "f") enterDepart();
  else if (btn === "r" && state.mode === "depart") enterRailFrom();
  else if (btn === "ent") confirm();
  else if (btn === "x") cancelCode();
  else if (["up","down","left","right"].includes(btn)) move(btn);
});

 // keyboard support for desktop testing
const KEY_MAP = {
  ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
  Enter:"ent", " ":"ent",
  Escape:"x", c:"x", Backspace:"bs", Delete:"bs",
  f:"f", d:"d", x:"x", y:"y", i:"i", r:"r"
};
function flash(el) { if (el) { el.classList.add("pressed"); setTimeout(()=>el.classList.remove("pressed"), 120); } buzz(12); }
/* haptic feedback on mobile: short tap per key, double-buzz on errors.
   No-op on desktop and iOS (no Vibration API there). */
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p || 12); } catch(e) {} }
document.addEventListener("keydown", (e) => {
  if (e.key >= "0" && e.key <= "9") {
    flash(document.querySelector(`button[data-num="${e.key}"]`));
    state.seq = []; appendDigit(e.key); return;
  }
  // rail letter entry: a full keyboard types station names directly
  if ((state.mode === "rail_from" || state.mode === "rail_to") && /^[a-zA-Z ]$/.test(e.key)) {
    e.preventDefault();
    state.seq = []; appendRailLetter(e.key); return;
  }
  const btn = KEY_MAP[e.key];
  if (!btn) return;
  e.preventDefault();
  flash(document.querySelector(`button[data-btn="${btn}"]`));
  if (btn === "r" || btn === "x" || btn === "ent") { if (adminSeq(btn)) return; }
  else state.seq = [];
  if (btn === "d") enterCode();
  else if (btn === "i") enterInsert();
  else if (btn === "f") enterDepart();
  else if (btn === "r" && state.mode === "depart") enterRailFrom();
  else if (btn === "ent") confirm();
  else if (btn === "x") cancelCode();
  else if (btn === "bs") backspace();
  else if (["up","down","left","right"].includes(btn)) move(btn);
});

setInterval(refresh, 2000);
render();
refresh();
</script>
