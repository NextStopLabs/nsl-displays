<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Destination Controller</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* cloud-only: bus picker + offline banner (sits above the faceplate) */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px 4px;
      background: #000;
    }

    .topbar .brand {
      color: #777;
      font-size: 11px;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .ctrl-select {
      background: #151618;
      color: #ffb21c;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
      max-width: 60vw;
    }

    .offline {
      flex: 0 0 auto;
      text-align: center;
      color: #ff5a4a;
      font-size: 11px;
      padding: 0 8px 4px;
      background: #000;
      min-height: 0;
    }

    .offline:empty {
      display: none;
    }

    /* stage: the faceplate is drawn in a fixed 677x214 design space and
     scaled to fit whatever space is available */
    .stage {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
    }

    .hint {
      flex: 0 0 auto;
      text-align: center;
      color: #777;
      font-size: 11px;
      padding: 6px 8px 10px;
    }

    .unit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 600px;
      height: 214px;
      transform-origin: 50% 50%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
      background: radial-gradient(120% 140% at 30% 0%, #5c6168 0%, #4b4f55 45%, #3d4147 100%);
    }

    .unit::after {
      /* inner edge shading */
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 6px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, .55), inset 0 -2px 4px rgba(0, 0, 0, .35);
    }

    /* everything inside is positioned in the original 768x262 coordinates,
     shifted so only the grey faceplate shows */
    .inner {
      position: absolute;
      left: -31px;
      top: -24px;
      width: 768px;
      height: 262px;
    }

    /* logo */
    .hv-logo {
      position: absolute;
      left: 47px;
      top: 34px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hv-logo img {
      height: 32px;
      width: auto;
      display: block;
    }

    .hv-model {
      font-size: 15px;
      font-weight: 600;
      color: #16181b;
      letter-spacing: .3px;
    }

    .hv-led {
      position: absolute;
      left: 75px;
      top: 70px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5a1a14, #1d0806 70%);
      box-shadow: 0 0 0 1.5px #25272b;
    }

    /* card slot */
    .hv-slot {
      position: absolute;
      left: 53px;
      top: 88px;
      width: 72px;
      height: 72px;
      background: #0a0a0b;
      box-shadow: 0 0 0 1px #2a2c30, inset 0 0 0 1px #1a1a1c;
    }

    .hv-slot::after {
      content: "";
      position: absolute;
      left: 34px;
      top: 0;
      width: 3px;
      height: 72px;
      background: #1c1c1e;
    }

    .hv-slot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .07), transparent 40%);
    }

    /* display */
    .display {
      position: absolute;
      left: 50px;
      top: 73px;
      width: 313px;
      height: 110px;
      background: #060505;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 0 0 3px #17181b, 0 0 0 4px #53575d, inset 0 0 14px rgba(0, 0, 0, .9);
      color: #ffb21c;
      font-family: "DejaVu Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      text-shadow: 0 0 5px rgba(255, 170, 0, .55);
    }

    .display::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .hv-route {
      position: absolute;
      left: 17px;
      top: 5px;
      font-size: 45px;
      font-weight: 700;
      line-height: 50px;
      letter-spacing: -.5px;
      white-space: nowrap;
    }

    .hv-dest {
      position: absolute;
      left: 92px;
      top: 6px;
      width: 208px;
      height: 50px;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 16.5px;
      font-weight: 700;
      line-height: 22px;
    }

    .hv-dest div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .hv-left {
      position: absolute;
      left: 14px;
      top: 62px;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .5px;
      white-space: pre;
    }

    .hv-right {
      position: absolute;
      right: 15px;
      top: 62px;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .5px;
      white-space: pre;
      text-align: right;
    }

    .dim {
      color: #b87d00;
      text-shadow: none;
    }

    .hv-left.dim {
      font-size: 15px;
      top: 65px;
    }

    /* non-default screens (code entry, service / destination lists) */
    .hv-flex {
      position: absolute;
      inset: 0;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .big {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .small {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .5px;
    }

    .entry {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    .err {
      color: #ff5a4a;
      text-shadow: none;
    }

    .list {
      font-size: 14px;
      line-height: 19px;
      margin-top: 4px;
    }

    .list .item {
      display: flex;
      gap: 8px;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .list .item span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list .item.sel {
      background: rgba(255, 178, 28, .25);
      color: #ffd36b;
    }

    /* key legends */
    .hv-abc {
      position: absolute;
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: .5px;
      color: #e9edf2;
      transform: translate(-50%, -50%);
    }

    /* keys */
    .key {
      position: absolute;
      width: 35px;
      height: 35px;
      margin: -17.5px 0 0 -17.5px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      cursor: pointer;
      outline: none;
      font: 700 16px/35px "Helvetica Neue", Arial, sans-serif;
      color: #2a2f36;
      background: radial-gradient(circle at 50% 30%, #f4f7fb 0%, #d4dbe4 45%, #a3afbd 100%);
      box-shadow: 0 2px 3px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -2px 3px rgba(60, 75, 95, .35);
      transition: transform .04s, box-shadow .04s;
    }

    .key:active,
    .key.pressed {
      transform: translateY(1px) scale(.97);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, inset 0 2px 4px rgba(60, 75, 95, .5);
    }

    .key:focus-visible {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4d9bff;
    }

    .key.red {
      color: #d42a1e;
    }

    .key.amber {
      color: #e8730a;
      font-size: 15px;
      background: radial-gradient(circle at 50% 30%, #fff3c6 0%, #ffd470 40%, #f4a323 100%);
      box-shadow: 0 2px 3px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, 0 0 9px rgba(255, 185, 60, .55),
        inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -2px 3px rgba(190, 110, 10, .35);
    }

    .key.amber:active,
    .key.amber.pressed {
      box-shadow: 0 1px 1px rgba(0, 0, 0, .6), 0 0 0 1.5px #2a2d32, 0 0 6px rgba(255, 185, 60, .4), inset 0 2px 4px rgba(190, 110, 10, .5);
    }

    .key.arrow svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 35px;
      height: 35px;
    }

    .key.arrow svg path {
      fill: #2a2f36;
      stroke: #2a2f36;
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .key.ent {
      font-size: 12px;
      letter-spacing: -.2px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">DESTINATION CONTROLLER</div>
    <select class="ctrl-select" id="ctrlsel"><option value="">select bus…</option></select>
  </div>
  <div class="offline" id="offline"></div>
  <div class="stage" id="stage">
    <div class="unit" id="unit" style="transform: translate(-50%, -50%) scale(1.39291);">
      <div class="inner">

        <div class="hv-logo">
          <img src="NSL-Displays-1.png" alt="NSL Displays">
          <span class="hv-model">NC1</span>
        </div>

        <div class="display" id="screen">
          <div class="hv-route" style="font-size:45px">--</div>
          <div class="hv-dest">
            <div>No destination</div>
          </div>
          <div class="hv-right">----</div>
        </div>

        <!-- key legends -->
        <span class="hv-abc" style="left:435px;top:75px;">ABC</span>
        <span class="hv-abc" style="left:500px;top:75px;">DEF</span>
        <span class="hv-abc" style="left:565px;top:75px;">GHI</span>
        <span class="hv-abc" style="left:435px;top:120px;">JKL</span>
        <span class="hv-abc" style="left:500px;top:120px;">MNO</span>
        <span class="hv-abc" style="left:565px;top:120px;">PQR</span>
        <span class="hv-abc" style="left:435px;top:165px;">STU</span>
        <span class="hv-abc" style="left:500px;top:165px;">VWX</span>
        <span class="hv-abc" style="left:565px;top:165px;">YZ</span>

        <!-- keypad -->
        <button class="key red" data-btn="x" style="left:400px;top:75px">X</button>
        <button class="key" data-num="1" style="left:465px;top:73px">1</button>
        <button class="key" data-num="2" style="left:530px;top:73px">2</button>
        <button class="key" data-num="3" style="left:595px;top:73px">3</button>

        <button class="key red" data-btn="y" style="left:400px;top:119px">Y</button>
        <button class="key" data-num="4" style="left:465px;top:119px">4</button>
        <button class="key" data-num="5" style="left:530px;top:119px">5</button>
        <button class="key" data-num="6" style="left:595px;top:119px">6</button>

        <button class="key amber" data-btn="i" style="left:400px;top:162px">I</button>
        <button class="key" data-num="7" style="left:465px;top:162px">7</button>
        <button class="key" data-num="8" style="left:530px;top:162px">8</button>
        <button class="key" data-num="9" style="left:595px;top:162px">9</button>

        <button class="key amber" data-btn="r" style="left:400px;top:207px">R</button>
        <button class="key amber" data-btn="d" style="left:465px;top:207px">D</button>
        <button class="key" data-num="0" style="left:530px;top:207px">0</button>
        <button class="key amber ent" data-btn="ent" style="left:595px;top:207px">ENT</button>

        <!-- arrows + F -->
        <button class="key arrow" data-btn="left" style="left:65px;top:207px" title="Back" aria-label="Left"><svg
            viewBox="0 0 35 35">
            <path d="M22 9 L11 17.5 L22 26 Z"></path>
          </svg></button>
        <button class="key arrow" data-btn="right" style="left:115px;top:207px" title="Enter destinations"
          aria-label="Right"><svg viewBox="0 0 35 35">
            <path d="M13 9 L24 17.5 L13 26 Z"></path>
          </svg></button>
        <button class="key arrow" data-btn="up" style="left:165px;top:207px" title="Up" aria-label="Up"><svg
            viewBox="0 0 35 35">
            <path d="M17.5 10 L27 23 L8 23 Z"></path>
          </svg></button>
        <button class="key arrow" data-btn="down" style="left:215px;top:207px" title="Down" aria-label="Down"><svg
            viewBox="0 0 35 35">
            <path d="M17.5 25 L27 12 L8 12 Z"></path>
          </svg></button>
        <button class="key amber" data-btn="f" style="left:345px;top:207px">F</button>

      </div>
    </div>
  </div>
  <div class="hint" id="hint">D = type code · ▲▼ = services · ENT = select</div>

<script>
/* cloud wiring (bus picker + auth); faceplate + logic below match the Pi exactly */
const PREFIX = location.pathname.startsWith("/portal") ? "/portal" : "";
const ORG = localStorage.getItem("nsl_org") || "";
const TOKEN = localStorage.getItem("nsl_token") || "";
const urlCid = new URLSearchParams(location.search).get("cid");
const state = { controllers: [], cid: urlCid || null, selBus: 0, services: [], current: {}, live: {}, mode: "view", selSvc: 0, selDest: 0, code: [], codeError: "", listError: "", pending: null };
const MAX_CODE = 5;
const LIST_ROWS = 4;
const screen = document.getElementById("screen");
const hint = document.getElementById("hint");
const offline = document.getElementById("offline");
const ctrlsel = document.getElementById("ctrlsel");

/* ---------- scale the faceplate to fit ---------- */
const stage = document.getElementById("stage");
const unit = document.getElementById("unit");
function fit() {
  const s = Math.min(stage.clientWidth / 677, stage.clientHeight / 214);
  unit.style.transform = `translate(-50%,-50%) scale(${s})`;
}
new ResizeObserver(fit).observe(stage);
fit();

/* ---------- API ---------- */
async function api(path, body) {
  const token = localStorage.getItem("nsl_token") || "";
  const opts = body
    ? { method: "POST", headers: {"Content-Type":"application/json", "Authorization":"Bearer "+token}, body: JSON.stringify(body) }
    : { headers: {"Authorization":"Bearer "+token} };
  const r = await fetch(PREFIX + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>null))?.detail || ("HTTP "+r.status));
  return r.json().catch(()=>null);
}
async function loadControllers() {
  const token = localStorage.getItem("nsl_token") || "";
  const org = localStorage.getItem("nsl_org") || "";
  if (!token || !org) {
    ctrlsel.innerHTML = `<option value="">login required</option>`;
    offline.textContent = "sign in on the portal first, then reopen the controller";
    state.cid = null;
    render();
    return;
  }
  try {
    const res = await api("/api/controllers?organisation_id=" + encodeURIComponent(org));
    // NOTE: backend rows carry status/organisation_id, not a `paired` flag —
    // filtering on c.paired emptied the list. Every row in this org is usable.
    state.controllers = res.controllers || [];
    if (!state.controllers.length) {
      ctrlsel.innerHTML = `<option value="">no buses paired</option>`;
      state.cid = null;
      render();
      return;
    }
    ctrlsel.innerHTML = `<option value="">select bus…</option>` +
      state.controllers.map(c => `<option value="${esc(c.id)}">${esc(c.name || c.id.slice(0, 8))} ${c.online ? "●" : "○"}</option>`).join("");
    const saved = localStorage.getItem("nsl_cid") || "";
    if (state.cid && state.controllers.find(c => c.id === state.cid)) {
      ctrlsel.value = state.cid;
    } else if (saved && state.controllers.find(c => c.id === saved)) {
      state.cid = saved;
      ctrlsel.value = saved;
    } else if (state.controllers.length === 1) {
      // single bus: just pick it
      selectBus(0, true);
      return;
    } else {
      state.cid = null;
      state.selBus = 0;
    }
    offline.textContent = "";
    render();
  } catch(e) {
    ctrlsel.innerHTML = `<option value="">login required</option>`;
    offline.textContent = String(e.message || e);
    state.cid = null;
    render();
  }
}
function selectBus(i, silent) {
  const c = state.controllers[i];
  if (!c) return;
  state.cid = c.id;
  state.selBus = i;
  try { localStorage.setItem("nsl_cid", c.id); } catch(e){}
  ctrlsel.value = c.id;
  state.services = []; state.live = {}; state.current = {}; state.mode = "view"; state.selSvc = 0; state.selDest = 0; state.pending = null;
  const url = new URL(location.href);
  url.searchParams.set("cid", c.id);
  history.replaceState(null, "", url);
  offline.textContent = "";
  if (!silent) refresh(); else refresh();
}
function cmdPath(cmd, body) {
  return api("/api/controllers/" + state.cid + "/command", Object.assign({command: cmd}, body || {}));
}
async function refresh() {
  if (!state.cid) { render(); return; }
  try {
    state.live = await api("/api/controllers/" + state.cid + "/live") || {};
    state.current = { service: state.live.service || {}, destination: state.live.destination || {} };
    offline.textContent = state.live.online ? "" : (state.live.stale ? "bus offline / stale state" : "");
    if (!state.services.length) {
      try { const b = await api("/api/controllers/" + state.cid + "/browse"); state.services = b.services || []; } catch(e){}
    }
    // a queued ENT is "loaded" once the bus reports the expected destination
    if (state.pending) {
      const ld = state.live.destination || {};
      const p = state.pending;
      const matched = (p.destId && ld.id === p.destId) || (p.codeStr && ld.code === p.codeStr);
      const timedOut = Date.now() - (p.at || 0) > 60000;
      if (matched || timedOut) state.pending = null;
    }
  } catch(e) { offline.textContent = String(e.message || e); }
  if (state.mode === "view") render();
}

/* optimistic pending: route number + LOADING where the driver message sits */
function lookupCode(code) {
  for (const s of state.services || []) {
    for (const d of (s.destinations || [])) {
      if (String(d.code) === String(code)) return { svc: s, dest: d };
    }
  }
  return null;
}
function showPending(num, codeFmt, destId, codeStr) {
  state.pending = { num: String(num || "--"), code: codeFmt, destId: destId || null, codeStr: codeStr || null, at: Date.now() };
  state.mode = "view";
  render();
}

/* ---------- helpers ---------- */
function fmtCode(c) {
  if (!c && c !== "0") return "----";
  return String(c).padStart(4, "0");
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function splitDest(s) {
  s = String(s || "");
  const words = s.split(" ");
  if (s.length <= 16 || words.length < 2) return [s];
  let best = 1, bd = 1e9;
  for (let i = 1; i < words.length; i++) {
    const d = Math.abs(words.slice(0,i).join(" ").length - words.slice(i).join(" ").length);
    if (d < bd) { bd = d; best = i; }
  }
  return [words.slice(0,best).join(" "), words.slice(best).join(" ")];
}
function windowRange(n, sel, size) {
  const start = Math.max(0, Math.min(sel - Math.floor(size / 2), n - size));
  return [start, Math.min(n, start + size)];
}
function listHtml(items, sel, label) {
  if (!items.length) return `<div class="list"><div class="item"><span>&nbsp;</span><span>NONE</span></div></div>`;
  const [a, b] = windowRange(items.length, sel, LIST_ROWS);
  let h = "";
  for (let i = a; i < b; i++) {
    h += `<div class="item ${i===sel?"sel":""}"><span>${i===sel?">":" "}</span><span>${esc(label(items[i]))}</span></div>`;
  }
  return `<div class="list">${h}</div>`;
}

/* ---------- render ---------- */
function render() {
  if (!state.cid) {
    if (state.controllers.length) {
      screen.innerHTML = `<div class="hv-flex" style="justify-content:flex-start">
      <div class="small dim">SELECT BUS</div>
      ${listHtml(state.controllers, state.selBus, c => `${c.name || (c.id || "").slice(0, 8)} ${c.online ? "●" : "○"}`)}
    </div>`;
      hint.textContent = "▲▼ choose bus · ►/ENT select";
    } else {
      screen.innerHTML = `
    <div class="hv-route" style="font-size:45px">--</div>
    <div class="hv-dest"><div>Select a bus</div></div>
    <div class="hv-right">----</div>`;
      hint.textContent = "Choose a bus from the dropdown";
    }
    return;
  }
  const cur = state.current || {};
  const dest = cur.destination || {};
  const svc = cur.service || {};
  const msg = dest.name || dest.dest || svc.description || svc.name || "No destination";
  const code = fmtCode(dest.code || svc.number || "");

  if (state.mode === "code") {
    const entry = Array(MAX_CODE).fill("-").map((d,i) => state.code[i] || d).join("");
    screen.innerHTML = `<div class="hv-flex">
      <div class="line"><span class="small dim">CURRENT</span><span class="small">ENTER CODE</span></div>
      <div class="line"><span class="big">${esc(code)}</span><span class="entry">${entry}</span></div>
      <div class="line"><span class="small err">${state.codeError ? esc(state.codeError) : "&nbsp;"}</span></div>
    </div>`;
    hint.textContent = "Type 5 digits · ENT = confirm · X/C = cancel";
    return;
  }
  if (state.mode === "services") {
    screen.innerHTML = `<div class="hv-flex" style="justify-content:flex-start">
      <div class="small dim">SELECT SERVICE</div>
      ${listHtml(state.services, state.selSvc, s => `${s.number||"-"} ${s.name||""}`)}
    </div>`;
    hint.textContent = "▲▼ choose service · ► enter destinations";
    return;
  }
  if (state.mode === "destinations") {
    const sv = state.services[state.selSvc] || {};
    screen.innerHTML = `<div class="hv-flex" style="justify-content:flex-start">
      <div class="line"><span class="small dim">${esc(sv.number||"-")} ${esc(sv.name||"")}</span><span class="small err">${esc(state.listError)}</span></div>
      ${listHtml(sv.destinations || [], state.selDest, d => `${d.code||""} ${d.name||""}`)}
    </div>`;
    hint.textContent = "▲▼ choose destination · ENT = select · ◄ back";
    return;
  }

  const num = String(svc.number || "--");
  if (state.pending) {
    const p = state.pending;
    const pfs = p.num.length <= 2 ? 45 : p.num.length === 3 ? 34 : 26;
    screen.innerHTML = `
    <div class="hv-route" style="font-size:${pfs}px">${esc(p.num)}</div>
    <div class="hv-dest"><div>LOADING...</div></div>
    <div class="hv-right">${esc(p.code)}</div>`;
    hint.textContent = "sending to bus…";
    return;
  }
  const fs = num.length <= 2 ? 45 : num.length === 3 ? 34 : 26;
  screen.innerHTML = `
    <div class="hv-route" style="font-size:${fs}px">${esc(num)}</div>
    <div class="hv-dest">${splitDest(msg).map(l => `<div>${esc(l)}</div>`).join("")}</div>
    <div class="hv-right">${esc(code)}</div>`;
  hint.textContent = "D = type code · ▲▼ = services · ENT = select";
}

/* ---------- actions (logic unchanged) ---------- */
function enterCode() {
  if (!state.cid) return;
  state.pending = null;
  state.mode = "code"; state.code = []; state.codeError = ""; render();
}
function appendDigit(n) {
  if (state.mode !== "code") return;
  if (state.code.length >= MAX_CODE) state.code.shift();
  state.code.push(n); state.codeError = ""; render();
}
function backspace() {
  if (state.mode !== "code") return;
  state.code.pop(); state.codeError = ""; render();
}
function cancelCode() {
  if (state.mode === "code") { state.mode = "view"; state.codeError = ""; render(); return; }
  if (state.mode === "destinations") { state.mode = "services"; state.listError = ""; render(); return; }
  if (state.mode === "services") { state.mode = "view"; state.pending = null; render(); }
}
async function confirm() {
  if (!state.cid) {
    // bus-picker mode: ENT/► selects the highlighted bus
    if (state.controllers.length) selectBus(state.selBus);
    return;
  }
  if (state.mode === "code") {
    const c = state.code.join("");
    if (c.length === 0) return;
    if (!state.services.length) {
      try { const b = await api("/api/controllers/" + state.cid + "/browse"); state.services = b.services || []; } catch(e){}
    }
    const hit = lookupCode(c);
    const keep = state.code.slice();
    showPending(hit ? hit.svc.number : (state.current.service || {}).number, fmtCode(c), hit ? hit.dest.id : null, c);
    state.code = [];
    state.codeError = "";
    try {
      await cmdPath("select_code", {code:c});
      await refresh();
    } catch(e) {
      state.pending = null;
      state.mode = "code"; state.code = keep;
      state.codeError = "NOT FOUND";
      render();
    }
    return;
  }
  if (state.mode === "destinations") {
    const svc = state.services[state.selSvc];
    const dest = (svc&&svc.destinations||[])[state.selDest];
    if (!dest) return;
    showPending(svc.number, fmtCode(dest.code), dest.id, dest.code);
    state.listError = "";
    try {
      await cmdPath("select_destination", {destination_id:dest.id});
      await refresh();
    } catch(e) {
      state.pending = null;
      state.mode = "destinations";
      state.listError = "ERROR";
      render();
    }
    return;
  }
  if (state.mode === "services") {
    state.mode = "destinations"; state.selDest = 0; state.listError = ""; render();
  }
}
function move(dir) {
  if (!state.cid) {
    // bus-picker mode: browse buses with the arrows, ► also selects
    if (dir === "up") state.selBus = Math.max(0, state.selBus - 1);
    else if (dir === "down") state.selBus = Math.min(state.controllers.length - 1, state.selBus + 1);
    else if (dir === "right") { confirm(); return; }
    else return;
    render();
    return;
  }
  if (state.mode === "code") {
    if (dir === "left") backspace();          // ◄ deletes a digit while typing a code
    return;
  }
  if (state.mode === "services") {
    if (dir === "up") state.selSvc = Math.max(0, state.selSvc-1);
    if (dir === "down") state.selSvc = Math.min(state.services.length-1, state.selSvc+1);
    if (dir === "right") { confirm(); return; }
    render();
  } else if (state.mode === "destinations") {
    const svc = state.services[state.selSvc] || {};
    const n = (svc.destinations||[]).length;
    if (dir === "up") state.selDest = Math.max(0, state.selDest-1);
    if (dir === "down") state.selDest = Math.min(n-1, state.selDest+1);
    if (dir === "left") { state.mode = "services"; }
    state.listError = "";
    render();
  } else if (state.mode === "view") {
    if (dir === "up" || dir === "down") { state.pending = null; state.mode = "services"; state.selSvc = 0; render(); }
  }
}

/* ---------- input ---------- */
document.body.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  e.preventDefault();
  const num = b.dataset.num;
  const btn = b.dataset.btn;
  if (num !== undefined) { appendDigit(num); return; }
  if (btn === "d") enterCode();
  else if (btn === "ent") confirm();
  else if (btn === "x") cancelCode();
  else if (["up","down","left","right"].includes(btn)) move(btn);
});
ctrlsel.addEventListener("change", () => {
  state.cid = ctrlsel.value || null;
  if (state.cid) {
    const i = state.controllers.findIndex(c => c.id === state.cid);
    if (i >= 0) state.selBus = i;
    try { localStorage.setItem("nsl_cid", state.cid); } catch(e){}
  } else {
    try { localStorage.removeItem("nsl_cid"); } catch(e){}
  }
  state.services = []; state.live = {}; state.current = {}; state.mode = "view"; state.selSvc = 0; state.selDest = 0; state.pending = null;
  const url = new URL(location.href);
  if (state.cid) url.searchParams.set("cid", state.cid); else url.searchParams.delete("cid");
  history.replaceState(null, "", url);
  refresh();
});

// keyboard support for desktop testing
const KEY_MAP = {
  ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
  Enter:"ent", " ":"ent",
  Escape:"x", c:"x", Backspace:"bs", Delete:"bs",
  f:"f", d:"d", x:"x", y:"y", i:"i", r:"r"
};
function flash(el) { if (el) { el.classList.add("pressed"); setTimeout(()=>el.classList.remove("pressed"), 120); } }
document.addEventListener("keydown", (e) => {
  if (e.key >= "0" && e.key <= "9") {
    flash(document.querySelector(`button[data-num="${e.key}"]`));
    appendDigit(e.key); return;
  }
  const btn = KEY_MAP[e.key];
  if (!btn) return;
  e.preventDefault();
  flash(document.querySelector(`button[data-btn="${btn}"]`));
  if (btn === "d") enterCode();
  else if (btn === "ent") confirm();
  else if (btn === "x") cancelCode();
  else if (btn === "bs") backspace();
  else if (["up","down","left","right"].includes(btn)) move(btn);
});

setInterval(refresh, 2000);
render();
loadControllers().then(refresh);
</script>
</body>
</html>
