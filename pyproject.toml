[project]
name = "nsl-displays"
version = "1.0.0"
description = "NSL Displays - bus stop announcement & LED destination system"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "evdev>=1.6; platform_system=='Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "playwright>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: real-browser end-to-end tests (need playwright chromium)"]

[tool.ruff]
line-length = 100
target-version = "py311"
